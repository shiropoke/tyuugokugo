<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="拼音を見て、対応する簡体字を答える中国語学習クイズです。">
    <title>中国語 拼音クイズ</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app-shell">
      <section id="start-screen" class="screen card" aria-labelledby="start-title">
        <p class="eyebrow">PINYIN PRACTICE</p>
        <h1 id="start-title">中国語 拼音クイズ</h1>
        <p class="lead">表示された拼音に対応する中国語を入力してください</p>

        <fieldset class="question-count">
          <legend>出題数</legend>
          <div class="choice-grid">
            <label class="choice">
              <input type="radio" name="question-count" value="10" checked>
              <span>10問</span>
            </label>
            <label class="choice">
              <input type="radio" name="question-count" value="20">
              <span>20問</span>
            </label>
            <label class="choice">
              <input type="radio" name="question-count" value="all">
              <span>全問</span>
            </label>
          </div>
        </fieldset>

        <div class="button-stack">
          <button id="start-button" class="button button-primary" type="button">クイズを始める</button>
          <button id="start-review-button" class="button button-secondary" type="button" hidden>
            間違えた問題だけ復習
          </button>
        </div>
        <p id="saved-mistakes-note" class="saved-note" hidden></p>
      </section>

      <section id="quiz-screen" class="screen card" aria-labelledby="quiz-title" hidden>
        <h1 id="quiz-title" class="visually-hidden">中国語 拼音クイズ</h1>

        <div class="quiz-status" aria-label="クイズの進行状況">
          <p><span id="current-number">1</span> / <span id="total-number">10</span> 問</p>
          <p>正解 <strong id="correct-count">0</strong> 問</p>
        </div>
        <div
          id="progress-bar"
          class="progress"
          role="progressbar"
          aria-label="クイズの進捗"
          aria-valuemin="0"
          aria-valuemax="10"
          aria-valuenow="0"
        >
          <span id="progress-fill"></span>
        </div>

        <div class="prompt-area">
          <p class="prompt-label">この拼音の中国語は？</p>
          <p id="pinyin" class="pinyin" lang="zh-Latn">lǐtáng</p>
          <button id="hint-button" class="text-button" type="button" aria-expanded="false">
            日本語のヒントを見る
          </button>
          <p id="hint-text" class="hint" hidden></p>
        </div>

        <form id="answer-form" novalidate>
          <label for="answer-input">中国語（簡体字）</label>
          <input
            id="answer-input"
            class="answer-input chinese-text"
            name="answer"
            type="text"
            lang="zh-Hans"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="done"
          >
          <p id="input-error" class="input-error" role="alert" hidden>中国語を入力してください。</p>
          <div class="answer-actions">
            <button id="check-button" class="button button-primary" type="submit">答え合わせ</button>
            <button id="skip-button" class="button button-secondary" type="button">わからない</button>
          </div>
        </form>

        <div id="feedback" class="feedback" aria-live="polite" aria-atomic="true" hidden>
          <p id="judgement" class="judgement"></p>
          <dl class="answer-details">
            <div>
              <dt>正解</dt>
              <dd id="correct-answer" class="chinese-text" lang="zh-Hans"></dd>
            </div>
            <div>
              <dt>意味</dt>
              <dd id="answer-meaning"></dd>
            </div>
          </dl>
        </div>

        <div class="quiz-navigation">
          <button id="next-button" class="button button-primary" type="button" hidden>次の問題</button>
          <button id="restart-button" class="button button-quiet" type="button">最初からやり直す</button>
        </div>
      </section>

      <section id="result-screen" class="screen card" aria-labelledby="result-title" hidden>
        <p class="eyebrow">RESULT</p>
        <h1 id="result-title" tabindex="-1">クイズ結果</h1>

        <div class="score-panel">
          <p class="score"><span id="score-percent">0</span><span class="score-unit">点</span></p>
          <p><strong id="result-correct">0</strong> / <span id="result-total">0</span> 問正解</p>
          <p>正答率 <strong id="result-rate">0%</strong></p>
        </div>

        <section id="mistakes-section" class="mistakes" aria-labelledby="mistakes-title">
          <h2 id="mistakes-title">間違えた問題</h2>
          <ul id="mistakes-list"></ul>
        </section>
        <p id="perfect-message" class="perfect-message" hidden>全問正解です。よくできました！</p>

        <div class="button-stack">
          <button id="retry-button" class="button button-primary" type="button">もう一度挑戦</button>
          <button id="result-review-button" class="button button-secondary" type="button" hidden>
            間違えた問題だけ復習
          </button>
          <button id="back-button" class="button button-quiet" type="button">スタート画面に戻る</button>
        </div>
      </section>
    </main>

    <noscript>
      <p class="noscript-message">このクイズを利用するにはJavaScriptを有効にしてください。</p>
    </noscript>
    <script src="./words.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
