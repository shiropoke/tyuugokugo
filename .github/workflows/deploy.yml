name: Deploy static site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p site-dist
          cp index.html style.css script.js grammar.js grammar-data.js speech.js words.js english-vocabulary.js english-vocabulary-data.js ranked-map.js site-dist/
          mkdir -p site-dist/assets/ranked-maps
          cp assets/ranked-maps/*.jpeg site-dist/assets/ranked-maps/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
